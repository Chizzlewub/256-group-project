<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subscribe — Sports Daily</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- React (CDN, no build tools) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body class="bg-white">
  <div id="root"></div>

  <script>
    const { useState, useEffect } = React;

    function SubscriberApp() {
      const emptyForm = {
        name: "",
        email: "",
        age: "",
        address: "",
        phone: "",
        sport: ""
      };

      const [form, setForm] = useState(emptyForm);
      const [subs, setSubs] = useState(
        JSON.parse(localStorage.getItem("sd_subscribers") || "[]")
      );
      const [editId, setEditId] = useState(null);
      const [errors, setErrors] = useState({});
      const [success, setSuccess] = useState(false);

      useEffect(() => {
        localStorage.setItem("sd_subscribers", JSON.stringify(subs));
      }, [subs]);

      function validate() {
        const e = {};
        if (!form.name) e.name = "Full name is required.";
        if (!/\S+@\S+\.\S+/.test(form.email)) e.email = "Valid email required.";
        if (!form.age) e.age = "Age is required.";
        if (!form.address) e.address = "Street address required.";
        setErrors(e);
        return Object.keys(e).length === 0;
      }

      function submit(e) {
        e.preventDefault();
        if (!validate()) return;

        if (editId) {
          setSubs(subs.map(s =>
            s.id === editId ? { ...s, ...form } : s
          ));
          setEditId(null);
        } else {
          setSubs([...subs, {
            id: Date.now(),
            ...form,
            joined: new Date().toLocaleDateString()
          }]);
        }

        setForm(emptyForm);
        setErrors({});
        setSuccess(true);
        setTimeout(() => setSuccess(false), 3000);
      }

      function edit(sub) {
        setForm(sub);
        setEditId(sub.id);
      }

      function remove(id) {
        if (!confirm("Remove this subscriber?")) return;
        setSubs(subs.filter(s => s.id !== id));
      }

      return React.createElement(
        "div",
        null,

        /* NAVBAR */
        React.createElement(
          "nav",
          { className: "navbar navbar-expand navbar-light border-bottom px-3" },
          React.createElement("a", { className: "navbar-brand fw-bold", href: "home-page.html" }, "Sports Daily"),
          React.createElement(
            "div",
            { className: "navbar-nav" },
            nav("Home", "home-page.html"),
            nav("Article Catalog", "articles.html"),
            nav("Subscribe", "subscriber.html", true),
            nav("Store", "shoppingcart.html")
          )
        ),

        /* HEADER */
        React.createElement(
          "div",
          { className: "bg-light border-bottom py-3 px-3" },
          React.createElement("h2", { className: "h4 fw-bold mb-1" }, "Magazine Subscriber Registrar"),
          React.createElement("p", { className: "text-muted small mb-0" }, "Join our community and get access to exclusive content")
        ),

        /* CONTENT */
        React.createElement(
          "div",
          { className: "container-fluid px-3 py-4" },
          React.createElement(
            "div",
            { className: "row g-4" },

            /* FORM */
            React.createElement(
              "div",
              { className: "col-md-5 col-lg-4" },
              React.createElement(
                "div",
                { className: "card" },
                React.createElement(
                  "form",
                  { className: "card-body", onSubmit: submit },
                  React.createElement("h6", { className: "text-uppercase fw-bold mb-3" },
                    editId ? "Edit Subscriber" : "New Subscriber"
                  ),

                  field("Full Name *", "name"),
                  error(errors.name),
                  field("Email *", "email", "email"),
                  error(errors.email),
                  field("Age *", "age", "number"),
                  error(errors.age),
                  field("Street Address *", "address"),
                  error(errors.address),
                  field("Phone (optional)", "phone"),
                  selectSport(),

                  success && React.createElement(
                    "div",
                    { className: "alert alert-success py-2 small" },
                    "Subscriber saved successfully!"
                  ),

                  React.createElement("button", { className: "btn btn-dark btn-sm w-100 mb-2", type: "submit" },
                    editId ? "Save Changes" : "Add Subscriber"
                  ),

                  editId && React.createElement(
                    "button",
                    {
                      type: "button",
                      className: "btn btn-outline-secondary btn-sm w-100",
                      onClick: () => { setEditId(null); setForm(emptyForm); }
                    },
                    "Cancel"
                  )
                )
              )
            ),

            /* LIST */
            React.createElement(
              "div",
              { className: "col-md-7 col-lg-8" },
              React.createElement("h6", { className: "text-uppercase fw-bold mb-1" }, "Subscribers"),
              React.createElement("p", { className: "text-muted small mb-3" },
                subs.length + " subscriber" + (subs.length !== 1 ? "s" : "")
              ),
              subs.length
                ? subs.map(s =>
                    React.createElement(
                      "div",
                      { key: s.id, className: "card mb-2" },
                      React.createElement(
                        "div",
                        { className: "card-body py-2 d-flex justify-content-between" },
                        React.createElement(
                          "div",
                          null,
                          React.createElement("h6", { className: "fw-bold mb-1" }, s.name),
                          React.createElement(
                            "p",
                            { className: "small text-muted mb-0" },
                            s.email, " • Age: ", s.age, s.sport ? " • " + s.sport : ""
                          ),
                          React.createElement(
                            "p",
                            { className: "small text-muted mb-0" },
                            s.address, " • Joined: ", s.joined
                          )
                        ),
                        React.createElement(
                          "div",
                          { className: "d-flex gap-2" },
                          React.createElement("button", { className: "btn btn-outline-secondary btn-sm", onClick: () => edit(s) }, "Edit"),
                          React.createElement("button", { className: "btn btn-outline-danger btn-sm", onClick: () => remove(s.id) }, "Remove")
                        )
                      )
                    )
                  )
                : React.createElement("p", { className: "text-muted border p-3 text-center" },
                    "No subscribers yet. Use the form to add one."
                  )
            )
          )
        )
      );

      function field(label, key, type = "text") {
        return React.createElement(
          "div",
          { className: "mb-2" },
          React.createElement("label", { className: "form-label small fw-bold text-uppercase" }, label),
          React.createElement("input", {
            type,
            className: "form-control form-control-sm",
            value: form[key],
            onChange: e => setForm({ ...form, [key]: e.target.value })
          })
        );
      }

      function error(msg) {
        return msg && React.createElement("div", { className: "invalid-feedback d-block" }, msg);
      }

      function selectSport() {
        return React.createElement(
          "select",
          {
            className: "form-select form-select-sm mb-3",
            value: form.sport,
            onChange: e => setForm({ ...form, sport: e.target.value })
          },
          ["", "Basketball", "Football", "Tennis", "Soccer", "Baseball", "Other"]
            .map(s => React.createElement("option", { key: s, value: s }, s || "— Select a sport —"))
        );
      }

      function nav(label, href, active = false) {
        return React.createElement(
          "a",
          { href, className: "nav-link" + (active ? " fw-bold active" : "") },
          label
        );
      }
    }

    ReactDOM.createRoot(document.getElementById("root"))
      .render(React.createElement(SubscriberApp));
  </script>
</body>
</html>
``
