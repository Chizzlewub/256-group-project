<!DOCTYPE html>
<html lang="en" ng-app="magApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Article Catalog — Sports Daily</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body class="bg-white" ng-controller="ArticleCtrl">

<nav class="navbar navbar-expand navbar-light border-bottom px-3">
  <a class="navbar-brand fw-bold" href="home-page.html">Sports Daily</a>
  <div class="navbar-nav">
    <a class="nav-link" href="home-page.html">Home</a>
    <a class="nav-link fw-bold active" href="articles.html">Article Catalog</a>
    <a class="nav-link" href="subscriber.html">Subscribe</a>
    <a class="nav-link" href="shoppingcart.html">Store</a>
  </div>
</nav>

<div class="bg-light border-bottom py-3 px-3">
  <h2 class="h4 fw-bold mb-1">Article Catalog</h2>
  <p class="text-muted small mb-0">Manage Sports Daily articles</p>
</div>

<div class="container-fluid px-3 py-4">
  <div class="row g-4">

    <!-- FORM -->
    <div class="col-md-4 col-lg-3">
      <div class="card">
        <div class="card-body">

          <h6 class="text-uppercase fw-bold mb-3">Add New Article</h6>

          <div class="mb-2">
            <label class="form-label small fw-bold">Title *</label>
            <input type="text" class="form-control form-control-sm" ng-model="article.title">
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Sport *</label>
            <select class="form-select form-select-sm" ng-model="article.sport">
              <option value="">— Select —</option>
              <option>Basketball</option>
              <option>Football</option>
              <option>Baseball</option>
              <option>Soccer</option>
              <option>Other</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Word Count *</label>
            <input type="number" class="form-control form-control-sm" ng-model="article.words">
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Access *</label>
            <select class="form-select form-select-sm" ng-model="article.access">
              <option value="">— Select —</option>
              <option>Free</option>
              <option>Subscribers Only</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Author</label>
            <input type="text" class="form-control form-control-sm" ng-model="article.author">
          </div>

          <!-- PUBLICATION OPTIONS -->
          <div class="mb-2">
            <label class="form-label small fw-bold">Publication Date *</label>
            <input type="date" class="form-control form-control-sm" ng-model="article.publication.date">
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Distribution Channels *</label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" ng-model="article.publication.web">
              <label class="form-check-label">Website</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" ng-model="article.publication.mobile">
              <label class="form-check-label">Mobile App</label>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Review Status *</label>
            <select class="form-select form-select-sm" ng-model="article.publication.status">
              <option value="">— Select —</option>
              <option>Draft</option>
              <option>In Review</option>
              <option>Approved</option>
              <option>Published</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Editorial Notes</label>
            <textarea class="form-control form-control-sm" ng-model="article.publication.notes"></textarea>
          </div>

          <button class="btn btn-dark btn-sm w-100" ng-click="submit()">Add Article</button>

        </div>
      </div>
    </div>

  </div>
</div>

<script src="articles.js"></script>
</body>
</html>
